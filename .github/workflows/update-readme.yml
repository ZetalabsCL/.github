name: Update Profile README

on:
  schedule:
    - cron: "0 6 * * *" # diario 06:00 UTC
  push:
    branches: [main]
    paths:
      - "scripts/update-readme.mjs"
      - ".github/workflows/update-readme.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Actualizar stack y métricas
        env:
          # PAT con lectura de repos de la org (incluye privados).
          # Sin él, solo se verían los repos públicos.
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/update-readme.mjs
      - name: Commit si hay cambios
        run: |
          if [[ -n "$(git status --porcelain profile/README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/README.md
            git commit -m "chore: auto-update stack y métricas de la org"
            git push
          else
            echo "Sin cambios."
          fi
